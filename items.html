<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anagrafica Articoli & Listini - Bar Inventory</title>
  <!-- Tailwind CSS per styling rapido e moderno -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen">

  <div class="max-w-7xl mx-auto px-4 py-8">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">
      <div>
        <h1 class="text-3xl font-bold tracking-tight text-gray-900">Catalogo Articoli</h1>
        <p class="text-sm text-gray-500 mt-1">Gestione articoli di magazzino e confronto listini fornitori</p>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="loadItems()" class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 shadow-sm transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          Aggiorna
        </button>
      </div>
    </div>

    <!-- Barra di Ricerca e Filtri -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 flex flex-col md:flex-row gap-4">
      <div class="flex-1">
        <input 
          type="text" 
          id="searchInput" 
          oninput="renderTable()"
          placeholder="Cerca per nome articolo..." 
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        />
      </div>
      <div class="w-full md:w-64">
        <select 
          id="categoryFilter" 
          onchange="renderTable()"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        >
          <option value="">Tutte le categorie</option>
        </select>
      </div>
    </div>

    <!-- Tabella Articoli -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-100/75 border-b border-gray-200 text-xs font-semibold text-gray-600 uppercase tracking-wider">
              <th class="py-3 px-4">Articolo</th>
              <th class="py-3 px-4">Formato</th>
              <th class="py-3 px-4">Imballo</th>
              <th class="py-3 px-4">Scorte (Min / Target)</th>
              <th class="py-3 px-4">Miglior Prezzo</th>
              <th class="py-3 px-4 text-right">Azioni</th>
            </tr>
          </thead>
          <tbody id="itemsTableBody" class="divide-y divide-gray-100 text-sm">
            <tr>
              <td colspan="6" class="text-center py-8 text-gray-400">Caricamento articoli in corso...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- MODAL CONFRONTO FORNITORI -->
  <div id="supplierModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl relative">
      <div class="flex items-center justify-between pb-4 border-b border-gray-100 mb-4">
        <div>
          <h3 id="modalTitle" class="text-lg font-bold text-gray-900">Dettaglio Prezzi</h3>
          <p id="modalSubtitle" class="text-xs text-gray-500"></p>
        </div>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 rounded-lg p-1 transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div id="modalContent" class="overflow-x-auto">
        <!-- Tabella Listini Iniettata via JS -->
      </div>

      <div class="mt-6 flex justify-end">
        <button onclick="closeModal()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium text-sm rounded-lg transition">
          Chiudi
        </button>
      </div>
    </div>
  </div>

  <script>
    // INSERISCI QUI LE TUE CHIAVI SE DIVERSE DAL CONFIG GLOBALE
    const SUPABASE_URL = window.SUPABASE_URL || 'INSERISCI_TUO_URL_SUPABASE';
    const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'INSERISCI_TUA_ANON_KEY';
    
    // Inizializzazione Client Supabase
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allItems = [];

    // 1. Caricamento Dati con Join Relazionale Completa
    async function loadItems() {
      try {
        const { data, error } = await supabase
          .from('items')
          .select(`
            id,
            name,
            category,
            unit_type,
            format_value,
            format_unit,
            units_per_pack,
            min_stock,
            target_stock,
            is_active,
            item_suppliers (
              id,
              supplier_sku,
              price_single,
              price_box,
              vat_rate,
              is_preferred,
              suppliers (
                id,
                name
              )
            )
          `)
          .eq('is_active', true)
          .order('name');

        if (error) throw error;

        allItems = data || [];
        populateCategories();
        renderTable();
      } catch (err) {
        console.error('Errore nel caricamento:', err);
        document.getElementById('itemsTableBody').innerHTML = `
          <tr>
            <td colspan="6" class="text-center py-6 text-red-500 font-medium">
              Errore nel caricamento dei dati: ${err.message}
            </td>
          </tr>
        `;
      }
    }

    // 2. Calcolo del Fornitore più Economico per l'Articolo
    function calculateBestPrice(itemSuppliers) {
      if (!itemSuppliers || itemSuppliers.length === 0) return null;

      // Considera solo listini con prezzo singolo valido
      const valid = itemSuppliers.filter(s => s.price_single && Number(s.price_single) > 0);
      if (valid.length === 0) return null;

      // Trova il record con prezzo unitario minore
      const best = valid.reduce((min, curr) => 
        Number(curr.price_single) < Number(min.price_single) ? curr : min
      );

      return {
        bestSupplierName: best.suppliers?.name || 'Fornitore',
        priceSingle: Number(best.price_single),
        priceBox: best.price_box ? Number(best.price_box) : null,
        totalSuppliers: valid.length
      };
    }

    // 3. Render Tabella
    function renderTable() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const selectedCategory = document.getElementById('categoryFilter').value;
      const tbody = document.getElementById('itemsTableBody');

      const filtered = allItems.filter(item => {
        const matchesName = item.name.toLowerCase().includes(search);
        const matchesCategory = selectedCategory === '' || item.category === selectedCategory;
        return matchesName && matchesCategory;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="text-center py-8 text-gray-400">Nessun articolo trovato con i criteri selezionati.</td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map(item => {
        const best = calculateBestPrice(item.item_suppliers);

        return `
          <tr class="hover:bg-gray-50/80 transition cursor-pointer" onclick="openSupplierModal('${item.id}')">
            <td class="py-3 px-4">
              <div class="font-semibold text-gray-900">${item.name}</div>
              <div class="text-xs text-gray-400">${item.category || 'Varie'}</div>
            </td>
            <td class="py-3 px-4 text-gray-700">
              <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-50 text-blue-700 border border-blue-200">
                ${item.format_value ? `${item.format_value} ${item.format_unit || ''}` : '-'}
              </span>
              <span class="text-xs text-gray-400 block mt-0.5">${item.unit_type || ''}</span>
            </td>
            <td class="py-3 px-4 text-gray-700">
              <div class="text-sm font-medium">${item.units_per_pack ? `${item.units_per_pack} pz / cassa` : '1 pz'}</div>
            </td>
            <td class="py-3 px-4">
              <span class="text-xs text-gray-500">Min: <b>${item.min_stock ?? 0}</b> | Target: <b>${item.target_stock ?? 0}</b></span>
            </td>
            <td class="py-3 px-4">
              ${best ? `
                <div class="inline-flex flex-col">
                  <div class="text-sm font-bold text-emerald-600">
                    ${best.priceSingle.toFixed(2)} €
                    <span class="text-xs font-normal text-gray-500">/ btg</span>
                  </div>
                  <div class="text-xs text-gray-500 flex items-center gap-1">
                    <span>${best.bestSupplierName}</span>
                    ${best.totalSuppliers > 1 ? `<span class="bg-gray-200 text-gray-700 rounded-full px-1.5 py-0.2 text-[10px] font-semibold">+${best.totalSuppliers - 1}</span>` : ''}
                  </div>
                </div>
              ` : `
                <span class="text-xs text-gray-400 italic">Nessun prezzo</span>
              `}
            </td>
            <td class="py-3 px-4 text-right" onclick="event.stopPropagation()">
              <button 
                onclick="openSupplierModal('${item.id}')" 
                class="inline-flex items-center px-3 py-1.5 border border-gray-200 text-xs font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-50 hover:border-gray-300 transition shadow-sm"
              >
                Vedi Listini (${item.item_suppliers ? item.item_suppliers.length : 0})
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    // 4. Modal di Confronto Listini Fornitori
    function openSupplierModal(itemId) {
      const item = allItems.find(i => i.id === itemId);
      if (!item) return;

      document.getElementById('modalTitle').textContent = item.name;
      document.getElementById('modalSubtitle').textContent = `Formato: ${item.format_value || ''} ${item.format_unit || ''} | Cassa da: ${item.units_per_pack || 1} pz`;

      const suppliers = item.item_suppliers || [];
      const modalContent = document.getElementById('modalContent');

      if (suppliers.length === 0) {
        modalContent.innerHTML = `
          <div class="text-center py-8 text-gray-400">
            Nessun fornitore o prezzo registrato per questo articolo.
          </div>
        `;
      } else {
        // Ordina dal prezzo singolo più basso
        const sorted = [...suppliers].sort((a, b) => (Number(a.price_single) || 999999) - (Number(b.price_single) || 999999));

        modalContent.innerHTML = `
          <table class="w-full text-left text-sm mt-2 border-collapse">
            <thead>
              <tr class="border-b border-gray-200 text-xs uppercase text-gray-500 font-semibold bg-gray-50">
                <th class="p-3">Fornitore</th>
                <th class="p-3">Cod. SKU</th>
                <th class="p-3">Prezzo Btg (Netto)</th>
                <th class="p-3">Prezzo Cassa</th>
                <th class="p-3 text-center">Note</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
              ${sorted.map((s, idx) => {
                const isBest = idx === 0 && Number(s.price_single) > 0;
                return `
                  <tr class="${isBest ? 'bg-emerald-50/60' : ''}">
                    <td class="p-3 font-medium text-gray-900">
                      ${s.suppliers?.name || 'Sconosciuto'}
                      ${isBest ? `<span class="ml-2 inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800">PIÙ ECONOMICO</span>` : ''}
                    </td>
                    <td class="p-3 text-gray-500 font-mono text-xs">${s.supplier_sku || '-'}</td>
                    <td class="p-3 font-semibold ${isBest ? 'text-emerald-700' : 'text-gray-800'}">
                      ${s.price_single ? `${Number(s.price_single).toFixed(2)} €` : '-'}
                    </td>
                    <td class="p-3 text-gray-600">
                      ${s.price_box ? `${Number(s.price_box).toFixed(2)} €` : '-'}
                    </td>
                    <td class="p-3 text-center">
                      ${s.is_preferred ? `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-blue-100 text-blue-800">Preferito</span>` : '-'}
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;
      }

      const modal = document.getElementById('supplierModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('supplierModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // 5. Popolamento Dropdown Categorie
    function populateCategories() {
      const categories = [...new Set(allItems.map(i => i.category).filter(Boolean))];
      const select = document.getElementById('categoryFilter');
      select.innerHTML = '<option value="">Tutte le categorie</option>' + 
        categories.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    // Carica al boot
    document.addEventListener('DOMContentLoaded', loadItems);
  </script>
</body>
</html>
