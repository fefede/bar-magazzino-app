<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Catalogo Articoli - Bar Magazzino</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-start p-4">

  <div class="w-full max-w-lg bg-slate-800 rounded-2xl shadow-xl p-5 border border-slate-700 my-auto">
    <!-- Intestazione -->
    <div class="flex items-center justify-between border-b border-slate-700 pb-3 mb-4">
      <div>
        <h1 class="text-lg font-bold text-amber-400">Catalogo Articoli</h1>
        <p id="role-subtitle" class="text-[11px] text-slate-400">Consultazione scorte minime</p>
      </div>
      <a href="index.html" class="text-xs text-slate-300 hover:text-white py-1.5 px-3 bg-slate-700 hover:bg-slate-600 rounded-lg border border-slate-600 transition">← Torna all'App</a>
    </div>

    <!-- Stato Caricamento -->
    <div id="status-loading" class="py-8 text-center text-sm text-slate-400">
      <div class="inline-block w-6 h-6 border-2 border-amber-400 border-t-transparent rounded-full animate-spin mb-2"></div>
      <p>Caricamento catalogo...</p>
    </div>

    <div id="main-content" class="hidden space-y-5">
      <!-- Modulo Inserimento / Modifica (Nascosto di default, visibile solo agli Admin) -->
      <form id="form-item" class="hidden bg-slate-900/80 p-4 rounded-xl border border-slate-700 space-y-3 text-xs">
        <div class="flex items-center justify-between">
          <h2 id="form-title" class="font-bold text-amber-400 uppercase tracking-wider text-[11px]">+ Nuovo Articolo</h2>
          <button type="button" id="btn-cancel-edit" class="hidden text-slate-400 hover:text-rose-400">Annulla modifica</button>
        </div>

        <input type="hidden" id="item-id" value="" />

        <div>
          <label class="block text-slate-400 mb-1">Nome Articolo *</label>
          <input type="text" id="input-name" required placeholder="Es. Gin Tanqueray 1L" class="w-full p-2.5 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400" />
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-400 mb-1">Fornitore</label>
            <select id="input-supplier" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-amber-400">
              <option value="">Nessun fornitore</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Categoria</label>
            <select id="input-category" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-amber-400">
              <option value="Alcolici">Alcolici & Liquori</option>
              <option value="Birre">Birre & Fusti</option>
              <option value="Bibite">Bibite & Analcolici</option>
              <option value="Caffetteria">Caffetteria</option>
              <option value="Monouso">Monouso & Consumabili</option>
              <option value="Altro">Altro</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-slate-400 mb-1">Unità</label>
            <select id="input-unit" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-amber-400">
              <option value="bottiglia">Bottiglia</option>
              <option value="fusto">Fusto</option>
              <option value="lattina">Lattina</option>
              <option value="cartone">Cartone</option>
              <option value="kg">Kg</option>
              <option value="pezzi">Pezzi</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Pezzi/Cartone</label>
            <input type="number" id="input-pack" min="1" value="1" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-amber-400" />
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Scorta Minima</label>
            <input type="number" id="input-min" min="0" value="2" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-amber-400" />
          </div>
        </div>

        <button type="submit" id="btn-submit" class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg transition active:scale-95">Salva Articolo</button>
      </form>

      <!-- Elenco Articoli Consultabile da Tutti gli Utenti Approvati -->
      <div class="space-y-2">
        <div class="flex items-center justify-between text-xs text-slate-400 px-1">
          <span id="items-count">Articoli registrati: 0</span>
          <button id="btn-refresh" class="text-amber-400 hover:text-amber-300 font-medium">Aggiorna ↻</button>
        </div>
        <div id="items-list" class="space-y-2 text-xs"></div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://wwtzkltjhllbclygwfqr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_2-ekTNVfaJteH0b4uJ4czQ_KN63kHLv';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusLoading = document.getElementById('status-loading');
    const mainContent = document.getElementById('main-content');
    const roleSubtitle = document.getElementById('role-subtitle');
    const itemsList = document.getElementById('items-list');
    const itemsCount = document.getElementById('items-count');
    const formItem = document.getElementById('form-item');
    const formTitle = document.getElementById('form-title');
    const btnCancelEdit = document.getElementById('btn-cancel-edit');
    const btnSubmit = document.getElementById('btn-submit');
    const inputSupplier = document.getElementById('input-supplier');

    const itemId = document.getElementById('item-id');
    const inputName = document.getElementById('input-name');
    const inputCategory = document.getElementById('input-category');
    const inputUnit = document.getElementById('input-unit');
    const inputPack = document.getElementById('input-pack');
    const inputMin = document.getElementById('input-min');

    let itemsData = [];
    let suppliersData = [];
    let isUserAdmin = false;

    async function init() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) { 
          window.location.href = 'index.html'; 
          return; 
        }

        const { data: profile, error } = await supabaseClient
          .from('profiles')
          .select('is_admin, is_approved')
          .eq('id', session.user.id)
          .single();

        if (error || !profile || !profile.is_approved) {
          alert('Accesso negato: utenza non abilitata.');
          window.location.href = 'index.html';
          return;
        }

        isUserAdmin = !!profile.is_admin;

        // Se è admin mostriamo il form di modifica/inserimento
        if (isUserAdmin) {
          roleSubtitle.textContent = 'Gestione anagrafica (Privilegi Admin)';
          formItem.classList.remove('hidden');
        } else {
          roleSubtitle.textContent = 'Consultazione catalogo scorte';
        }

        await loadSuppliersDropdown();
        await loadItems();

        statusLoading.classList.add('hidden');
        mainContent.classList.remove('hidden');
      } catch (err) {
        console.error('Errore inizializzazione:', err);
        window.location.href = 'index.html';
      }
    }

    async function loadSuppliersDropdown() {
      const { data } = await supabaseClient.from('suppliers').select('id, name').order('name');
      suppliersData = data || [];
      inputSupplier.innerHTML = '<option value="">Nessun fornitore</option>' + 
        suppliersData.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
    }

    async function loadItems() {
      const { data, error } = await supabaseClient
        .from('items')
        .select('*, suppliers(name)')
        .order('category', { ascending: true })
        .order('name', { ascending: true });

      if (error) {
        itemsList.innerHTML = `<p class="text-rose-400 p-2">Errore caricamento: ${error.message}</p>`;
        return;
      }

      itemsData = data || [];
      itemsCount.textContent = `Articoli registrati: ${itemsData.length}`;

      if (itemsData.length === 0) {
        itemsList.innerHTML = '<p class="text-slate-500 text-center py-4">Nessun articolo registrato nel catalogo.</p>';
        return;
      }

      itemsList.innerHTML = itemsData.map(item => `
        <div class="p-3 rounded-xl bg-slate-900 border border-slate-700/80 flex items-center justify-between gap-2">
          <div class="truncate">
            <div class="flex items-center gap-1.5">
              <span class="font-bold text-slate-200 text-sm truncate">${item.name}</span>
              <span class="text-[9px] px-1.5 py-0.5 rounded bg-slate-800 text-amber-300/80 border border-slate-700">${item.category}</span>
            </div>
            <p class="text-[11px] text-slate-400 mt-0.5">
              Fornitore: <span class="text-slate-300">${item.suppliers ? item.suppliers.name : 'Non assegnato'}</span> • 
              Minimo scorta: <span class="text-amber-400 font-mono font-bold">${item.min_stock}</span> ${item.unit_type}
              ${item.units_per_pack > 1 ? `(${item.units_per_pack} per cassa)` : ''}
            </p>
          </div>

          <!-- Pulsanti visibili unicamente agli Amministratori -->
          ${isUserAdmin ? `
            <div class="flex items-center gap-1 shrink-0">
              <button onclick="startEdit('${item.id}')" class="px-2 py-1 rounded bg-slate-800 text-amber-400 border border-slate-700 hover:bg-slate-700">Modifica</button>
              <button onclick="deleteItem('${item.id}', '${item.name.replace(/'/g, "\\'")}')" class="px-2 py-1 rounded bg-rose-500/10 text-rose-400 border border-rose-500/30 hover:bg-rose-500/20">Elimina</button>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    formItem.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Salvataggio...';

      const payload = {
        name: inputName.value.trim(),
        supplier_id: inputSupplier.value || null,
        category: inputCategory.value,
        unit_type: inputUnit.value,
        units_per_pack: parseInt(inputPack.value, 10) || 1,
        min_stock: parseInt(inputMin.value, 10) || 0
      };

      const id = itemId.value;
      const res = id 
        ? await supabaseClient.from('items').update(payload).eq('id', id)
        : await supabaseClient.from('items').insert([payload]);

      btnSubmit.disabled = false;
      btnSubmit.textContent = id ? 'Aggiorna Articolo' : 'Salva Articolo';

      if (res.error) {
        alert('Errore salvataggio: ' + res.error.message);
      } else {
        resetForm();
        loadItems();
      }
    });

    function startEdit(id) {
      const item = itemsData.find(i => i.id === id);
      if (!item) return;

      itemId.value = item.id;
      inputName.value = item.name;
      inputSupplier.value = item.supplier_id || '';
      inputCategory.value = item.category;
      inputUnit.value = item.unit_type;
      inputPack.value = item.units_per_pack || 1;
      inputMin.value = item.min_stock;

      formTitle.textContent = 'Modifica Articolo';
      btnSubmit.textContent = 'Aggiorna Articolo';
      btnCancelEdit.classList.remove('hidden');
      formItem.scrollIntoView({ behavior: 'smooth' });
    }

    function resetForm() {
      itemId.value = '';
      formItem.reset();
      formTitle.textContent = '+ Nuovo Articolo';
      btnSubmit.textContent = 'Salva Articolo';
      btnCancelEdit.classList.add('hidden');
    }

    async function deleteItem(id, name) {
      if (!confirm(`Sei sicuro di voler eliminare definitivamente "${name}"?`)) return;
      const { error } = await supabaseClient.from('items').delete().eq('id', id);
      if (error) {
        alert('Errore eliminazione: ' + error.message);
      } else {
        loadItems();
      }
    }

    btnCancelEdit.addEventListener('click', resetForm);
    document.getElementById('btn-refresh').addEventListener('click', loadItems);
    window.startEdit = startEdit;
    window.deleteItem = deleteItem;

    init();
  </script>
</body>
</html>
