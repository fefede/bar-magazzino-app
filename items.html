<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Catalogo Articoli - Bar Magazzino</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-start p-4">

  <div class="w-full max-w-lg bg-slate-800 rounded-2xl shadow-xl p-5 border border-slate-700 my-auto">
    <div class="flex items-center justify-between border-b border-slate-700 pb-3 mb-4">
      <div>
        <h1 class="text-lg font-bold text-amber-400">Catalogo Articoli</h1>
        <p id="role-subtitle" class="text-[11px] text-slate-400">Consultazione scorte minime</p>
      </div>
      <a href="index.html" class="text-xs text-slate-300 hover:text-white py-1.5 px-3 bg-slate-700 hover:bg-slate-600 rounded-lg border border-slate-600 transition">← Torna all'App</a>
    </div>

    <!-- Caricamento -->
    <div id="status-loading" class="py-8 text-center text-sm text-slate-400">
      <div class="inline-block w-6 h-6 border-2 border-amber-400 border-t-transparent rounded-full animate-spin mb-2"></div>
      <p>Caricamento catalogo...</p>
    </div>

    <div id="main-content" class="hidden space-y-5">
      <!-- Form Inserimento / Modifica (Solo Admin) -->
      <form id="form-item" class="hidden bg-slate-900/80 p-4 rounded-xl border border-slate-700 space-y-3 text-xs">
        <div class="flex items-center justify-between">
          <h2 id="form-title" class="font-bold text-amber-400 uppercase tracking-wider text-[11px]">+ Nuovo Articolo</h2>
          <button type="button" id="btn-cancel-edit" class="hidden text-slate-400 hover:text-rose-400">Annulla modifica</button>
        </div>

        <input type="hidden" id="item-id" value="" />

        <div>
          <label class="block text-slate-400 mb-1">Nome Articolo *</label>
          <input type="text" id="input-name" required placeholder="Es. Gin Tanqueray, Coca Cola, Heineken" class="w-full p-2.5 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400" />
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-400 mb-1">Categoria</label>
            <select id="input-category" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-amber-400">
              <option value="Alcolici">Alcolici & Liquori</option>
              <option value="Birre">Birre & Fusti</option>
              <option value="Bibite">Bibite & Analcolici</option>
              <option value="Vini">Vini & Bollicine</option>
              <option value="Caffetteria">Caffetteria</option>
              <option value="Monouso">Monouso & Consumabili</option>
              <option value="Altro">Altro</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Tipo Contenitore</label>
            <select id="input-unit" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-amber-400">
              <option value="Bottiglia Vetro">Bottiglia Vetro</option>
              <option value="Bottiglia PET">Bottiglia PET</option>
              <option value="Lattina">Lattina</option>
              <option value="Fusto">Fusto</option>
              <option value="Cartone / Bag-in-Box">Cartone / Bag-in-Box</option>
              <option value="Busta / Sacchetto">Busta / Sacchetto</option>
              <option value="Pezzi / Confezione">Pezzi / Confezione</option>
            </select>          
          </div>
        </div>

        <!-- Formato Contenuto: Valore + Unità -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-400 mb-1">Contenuto / Formato</label>
            <input type="number" step="any" id="input-format-val" placeholder="Es. 33, 70, 1, 30" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400" />
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Unità di Misura</label>
            <select id="input-format-unit" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-amber-400">
              <option value="cl">cl (Centilitri)</option>
              <option value="L">L (Litri)</option>
              <option value="ml">ml (Millilitri)</option>
              <option value="kg">kg (Chilogrammi)</option>
              <option value="g">g (Grammi)</option>
            </select>
          </div>
        </div>

        <!-- Parametri Scorta & Confezionamento -->
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-slate-400 mb-1">Pz./Cassa</label>
            <input type="number" id="input-pack" min="1" value="1" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-amber-400" />
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Scorta Min.</label>
            <input type="number" id="input-min" min="0" value="2" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-amber-400" />
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Scorta Obiet.</label>
            <input type="number" id="input-target" min="0" value="6" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-amber-400" />
          </div>
        </div>

        <button type="submit" id="btn-submit" class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg transition active:scale-95">Salva Articolo</button>
      </form>

      <!-- Elenco Articoli -->
      <div class="space-y-2">
        <div class="flex items-center justify-between text-xs text-slate-400 px-1">
          <span id="items-count">Articoli registrati: 0</span>
          <button id="btn-refresh" class="text-amber-400 hover:text-amber-300 font-medium">Aggiorna ↻</button>
        </div>
        <div id="items-list" class="space-y-2 text-xs"></div>
      </div>
    </div>
  </div>

  <!-- POPUP DETTAGLIO LISTINI (Stesso tema dark) -->
  <div id="supplier-modal" class="fixed inset-0 bg-black/75 hidden items-center justify-center z-50 p-4">
    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl p-5 border border-slate-700 relative">
      <div class="flex items-center justify-between border-b border-slate-700 pb-3 mb-3">
        <div>
          <h3 id="modal-item-name" class="font-bold text-amber-400 text-sm">Prezzi Fornitori</h3>
          <p id="modal-item-desc" class="text-[11px] text-slate-400"></p>
        </div>
        <button onclick="closeSupplierModal()" class="text-slate-400 hover:text-white p-1 text-base leading-none">✕</button>
      </div>

      <div id="modal-supplier-list" class="space-y-2 text-xs max-h-60 overflow-y-auto pr-1"></div>

      <div class="mt-4 pt-3 border-t border-slate-700/80 flex justify-end">
        <button onclick="closeSupplierModal()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold rounded-lg transition">Chiudi</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://wwtzkltjhllbclygwfqr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_2-ekTNVfaJteH0b4uJ4czQ_KN63kHLv';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusLoading = document.getElementById('status-loading');
    const mainContent = document.getElementById('main-content');
    const roleSubtitle = document.getElementById('role-subtitle');
    const itemsList = document.getElementById('items-list');
    const itemsCount = document.getElementById('items-count');
    const formItem = document.getElementById('form-item');
    const formTitle = document.getElementById('form-title');
    const btnCancelEdit = document.getElementById('btn-cancel-edit');
    const btnSubmit = document.getElementById('btn-submit');

    const itemId = document.getElementById('item-id');
    const inputName = document.getElementById('input-name');
    const inputCategory = document.getElementById('input-category');
    const inputUnit = document.getElementById('input-unit');
    const inputFormatVal = document.getElementById('input-format-val');
    const inputFormatUnit = document.getElementById('input-format-unit');
    const inputPack = document.getElementById('input-pack');
    const inputMin = document.getElementById('input-min');
    const inputTarget = document.getElementById('input-target');

    const supplierModal = document.getElementById('supplier-modal');
    const modalItemName = document.getElementById('modal-item-name');
    const modalItemDesc = document.getElementById('modal-item-desc');
    const modalSupplierList = document.getElementById('modal-supplier-list');

    let itemsData = [];
    let isUserAdmin = false;

    async function init() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) { 
          window.location.href = 'index.html'; 
          return; 
        }

        const { data: profile, error } = await supabaseClient
          .from('profiles')
          .select('is_admin, is_approved')
          .eq('id', session.user.id)
          .single();

        if (error || !profile || !profile.is_approved) {
          alert('Accesso negato.');
          window.location.href = 'index.html';
          return;
        }

        isUserAdmin = !!profile.is_admin;
        if (isUserAdmin) {
          roleSubtitle.textContent = 'Gestione anagrafica (Privilegi Admin)';
          formItem.classList.remove('hidden');
        } else {
          roleSubtitle.textContent = 'Consultazione catalogo scorte';
        }

        await loadItems();

        statusLoading.classList.add('hidden');
        mainContent.classList.remove('hidden');
      } catch (err) {
        console.error(err);
        window.location.href = 'index.html';
      }
    }

    async function loadItems() {
      // Join con item_suppliers e tabella suppliers
      const { data, error } = await supabaseClient
        .from('items')
        .select(`
          *,
          item_suppliers (
            id,
            supplier_sku,
            price_single,
            price_box,
            vat_rate,
            is_preferred,
            suppliers (
              id,
              name
            )
          )
        `)
        .order('category', { ascending: true })
        .order('name', { ascending: true });

      if (error) {
        itemsList.innerHTML = `<p class="text-rose-400 p-2">Errore: ${error.message}</p>`;
        return;
      }

      itemsData = data || [];
      itemsCount.textContent = `Articoli registrati: ${itemsData.length}`;

      if (itemsData.length === 0) {
        itemsList.innerHTML = '<p class="text-slate-500 text-center py-4">Nessun articolo registrato nel catalogo.</p>';
        return;
      }

      itemsList.innerHTML = itemsData.map(item => {
        const formatLabel = item.format_value ? `${item.format_value} ${item.format_unit}` : '';
        
        // Calcolo del fornitore più economico
        const suppliers = item.item_suppliers || [];
        const validSuppliers = suppliers.filter(s => s.price_single && Number(s.price_single) > 0);
        let bestPriceBadge = '';

        if (validSuppliers.length > 0) {
          const best = validSuppliers.reduce((min, curr) => 
            Number(curr.price_single) < Number(min.price_single) ? curr : min
          );
          const supName = best.suppliers?.name || 'Fornitore';
          const priceFormatted = Number(best.price_single).toFixed(2) + ' €';
          const extra = validSuppliers.length > 1 ? ` <span class="text-[9px] text-slate-400">(+${validSuppliers.length - 1})</span>` : '';

          bestPriceBadge = `
            <button onclick="openSupplierModal('${item.id}')" class="mt-1 inline-flex items-center gap-1.5 px-2 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 hover:bg-emerald-500/20 transition text-[11px]">
              <span class="font-bold font-mono">${priceFormatted}</span>
              <span class="text-[10px] text-slate-300">• ${supName}</span>
              ${extra}
            </button>
          `;
        } else {
          bestPriceBadge = `
            <span class="mt-1 inline-block text-[10px] text-slate-500 italic">Nessun prezzo inserito</span>
          `;
        }

        return `
        <div class="p-3 rounded-xl bg-slate-900 border border-slate-700/80 flex items-center justify-between gap-2">
          <div class="truncate">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="font-bold text-slate-200 text-sm truncate">${item.name}</span>
              ${formatLabel ? `<span class="text-[10px] px-1.5 py-0.2 bg-amber-500/10 text-amber-300 font-mono font-bold rounded border border-amber-500/20">${formatLabel}</span>` : ''}
              <span class="text-[9px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">${item.category}</span>
            </div>
            <p class="text-[11px] text-slate-400 mt-1">
              Scorta Min: <span class="text-amber-400 font-mono font-bold">${item.min_stock}</span> • 
              Obiettivo: <span class="text-emerald-400 font-mono font-bold">${item.target_stock}</span> ${item.unit_type}
              ${item.units_per_pack > 1 ? `(${item.units_per_pack}/cassa)` : ''}
            </p>
            <div>${bestPriceBadge}</div>
          </div>

          ${isUserAdmin ? `
            <div class="flex items-center gap-1 shrink-0">
              <button onclick="startEdit('${item.id}')" class="px-2 py-1 rounded bg-slate-800 text-amber-400 border border-slate-700 hover:bg-slate-700">Modifica</button>
              <button onclick="deleteItem('${item.id}', '${item.name.replace(/'/g, "\\'")}')" class="px-2 py-1 rounded bg-rose-500/10 text-rose-400 border border-rose-500/30 hover:bg-rose-500/20">Elimina</button>
            </div>
          ` : ''}
        </div>
      `}).join('');
    }

    function openSupplierModal(id) {
      const item = itemsData.find(i => i.id === id);
      if (!item) return;

      modalItemName.textContent = item.name;
      modalItemDesc.textContent = `${item.format_value ? item.format_value + ' ' + item.format_unit : ''} • Cassa da ${item.units_per_pack || 1} pz`;

      const list = item.item_suppliers || [];
      if (list.length === 0) {
        modalSupplierList.innerHTML = `<p class="text-slate-500 text-center py-3">Nessun listino registrato.</p>`;
      } else {
        const sorted = [...list].sort((a, b) => (Number(a.price_single) || 999) - (Number(b.price_single) || 999));
        modalSupplierList.innerHTML = sorted.map((s, idx) => {
          const isLowest = idx === 0 && Number(s.price_single) > 0;
          return `
            <div class="p-2.5 rounded-lg border ${isLowest ? 'bg-emerald-950/20 border-emerald-500/40' : 'bg-slate-900 border-slate-700'} flex items-center justify-between">
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="font-bold text-slate-200">${s.suppliers?.name || 'Fornitore'}</span>
                  ${isLowest ? '<span class="text-[9px] bg-emerald-500/20 text-emerald-400 px-1 rounded font-bold">MIGLIOR PREZZO</span>' : ''}
                </div>
                <div class="text-[10px] text-slate-400 mt-0.5">
                  ${s.supplier_sku ? `SKU: <span class="font-mono text-slate-300">${s.supplier_sku}</span>` : ''}
                </div>
              </div>
              <div class="text-right">
                <div class="font-mono font-bold text-amber-400 text-sm">
                  ${s.price_single ? Number(s.price_single).toFixed(2) + ' €' : '-'}
                  <span class="text-[10px] font-normal text-slate-400">/ btg</span>
                </div>
                ${s.price_box ? `<div class="text-[10px] text-slate-400 font-mono">Cassa: ${Number(s.price_box).toFixed(2)} €</div>` : ''}
              </div>
            </div>
          `;
        }).join('');
      }

      supplierModal.classList.remove('hidden');
      supplierModal.classList.add('flex');
    }

    function closeSupplierModal() {
      supplierModal.classList.add('hidden');
      supplierModal.classList.remove('flex');
    }

    formItem.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Salvataggio...';

      const payload = {
        name: inputName.value.trim(),
        category: inputCategory.value,
        unit_type: inputUnit.value,
        format_value: inputFormatVal.value ? parseFloat(inputFormatVal.value) : null,
        format_unit: inputFormatUnit.value,
        units_per_pack: parseInt(inputPack.value, 10) || 1,
        min_stock: parseInt(inputMin.value, 10) || 0,
        target_stock: parseInt(inputTarget.value, 10) || 0
      };

      const id = itemId.value;
      const res = id 
        ? await supabaseClient.from('items').update(payload).eq('id', id)
        : await supabaseClient.from('items').insert([payload]);

      btnSubmit.disabled = false;
      btnSubmit.textContent = id ? 'Aggiorna Articolo' : 'Salva Articolo';

      if (res.error) {
        alert('Errore salvataggio: ' + res.error.message);
      } else {
        resetForm();
        loadItems();
      }
    });

    function startEdit(id) {
      const item = itemsData.find(i => i.id === id);
      if (!item) return;

      itemId.value = item.id;
      inputName.value = item.name;
      inputCategory.value = item.category;
      inputUnit.value = item.unit_type;
      inputFormatVal.value = item.format_value || '';
      inputFormatUnit.value = item.format_unit || 'cl';
      inputPack.value = item.units_per_pack || 1;
      inputMin.value = item.min_stock;
      inputTarget.value = item.target_stock || 0;

      formTitle.textContent = 'Modifica Articolo';
      btnSubmit.textContent = 'Aggiorna Articolo';
      btnCancelEdit.classList.remove('hidden');
      formItem.scrollIntoView({ behavior: 'smooth' });
    }

    function resetForm() {
      itemId.value = '';
      formItem.reset();
      formTitle.textContent = '+ Nuovo Articolo';
      btnSubmit.textContent = 'Salva Articolo';
      btnCancelEdit.classList.add('hidden');
    }

    async function deleteItem(id, name) {
      if (!confirm(`Sei sicuro di voler eliminare definitivamente "${name}"?`)) return;
      const { error } = await supabaseClient.from('items').delete().eq('id', id);
      if (error) {
        alert('Errore eliminazione: ' + error.message);
      } else {
        loadItems();
      }
    }

    btnCancelEdit.addEventListener('click', resetForm);
    document.getElementById('btn-refresh').addEventListener('click', loadItems);
    window.startEdit = startEdit;
    window.deleteItem = deleteItem;
    window.openSupplierModal = openSupplierModal;
    window.closeSupplierModal = closeSupplierModal;

    init();
  </script>
</body>
</html>
