<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ordini & Verifiche - Bar Magazzino</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-start p-3 pb-24">

  <div class="w-full max-w-lg space-y-4">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-700 pb-3">
      <div>
        <h1 class="text-lg font-bold text-amber-400">Ordini & Verifiche</h1>
        <p class="text-[11px] text-slate-400">Gestione ordini spot e routine settimanale</p>
      </div>
      <a href="index.html" class="text-xs text-slate-300 hover:text-white py-1.5 px-3 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition">← Dashboard</a>
    </div>

    <!-- Selettore Modalità (Tab) -->
    <div class="grid grid-cols-2 gap-2 bg-slate-800/90 p-1 rounded-xl border border-slate-700">
      <button id="tab-checklist-btn" onclick="switchTab('checklist')" class="py-2 text-xs font-bold rounded-lg transition bg-amber-500 text-slate-950 shadow">
        📋 Verifica da Lista
      </button>
      <button id="tab-spot-btn" onclick="switchTab('spot')" class="py-2 text-xs font-semibold rounded-lg transition text-slate-400 hover:text-white">
        ⚡ Ordine Spot (Rapido)
      </button>
    </div>

    <!-- CARICAMENTO -->
    <div id="status-loading" class="py-12 text-center text-sm text-slate-400">
      <div class="inline-block w-6 h-6 border-2 border-amber-400 border-t-transparent rounded-full animate-spin mb-2"></div>
      <p>Caricamento dati...</p>
    </div>

    <!-- SEZIONE 1: VERIFICA DA LISTA -->
    <div id="section-checklist" class="hidden space-y-3">
      <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex items-center justify-between gap-2">
        <label class="text-xs text-slate-400 whitespace-nowrap">Seleziona Lista:</label>
        <select id="checklist-selector" onchange="loadChecklistItems()" class="w-full p-2 bg-slate-900 border border-slate-700 text-xs rounded-lg text-amber-300 focus:outline-none focus:border-amber-400"></select>
      </div>
      <div id="checklist-container" class="space-y-2"></div>
    </div>

    <!-- SEZIONE 2: ORDINE SPOT -->
    <div id="section-spot" class="hidden space-y-3">
      <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 space-y-2">
        <label class="text-xs text-slate-400">Cerca articolo da aggiungere:</label>
        <input type="text" id="spot-search" oninput="filterSpotItems()" placeholder="Es. Campari, Gin, Recoaro..." class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-400" />
        <div id="spot-search-results" class="max-h-48 overflow-y-auto space-y-1 pt-1 hidden"></div>
      </div>
      <div id="spot-cart-container" class="space-y-2">
        <p class="text-slate-500 text-xs text-center py-6">Nessun articolo aggiunto all'ordine temporaneo.</p>
      </div>
    </div>
  </div>

  <!-- BARRA FISSA IN BASSO: RIEPILOGO & INVIA -->
  <div id="bottom-bar" class="fixed bottom-0 left-0 right-0 bg-slate-800/95 backdrop-blur border-t border-slate-700 p-3 flex items-center justify-between max-w-lg mx-auto z-40">
    <div>
      <div class="text-[11px] text-slate-400">Totale stimato (<span id="cart-count">0</span> art.):</div>
      <div class="text-base font-bold font-mono text-amber-400" id="cart-total-price">0.00 €</div>
    </div>
    <button onclick="openSummaryModal()" class="px-4 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs rounded-xl shadow-lg transition active:scale-95 flex items-center gap-1.5">
      <span>Riepilogo Ordine</span> →
    </button>
  </div>

  <!-- MODAL RIEPILOGO E INVIO ORDINE -->
  <div id="summary-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">
    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl p-5 border border-slate-700 space-y-4 max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between border-b border-slate-700 pb-2">
        <div>
          <h3 class="font-bold text-amber-400 text-sm">Riepilogo Carrello Ordine</h3>
          <p class="text-[10px] text-slate-400">Verifica i quantitativi e i codici fornitore</p>
        </div>
        <button onclick="closeSummaryModal()" class="text-slate-400 hover:text-white text-lg">✕</button>
      </div>

      <div id="summary-list" class="overflow-y-auto space-y-2 text-xs flex-1 pr-1"></div>

      <div class="border-t border-slate-700 pt-3 space-y-2">
        <div class="flex justify-between text-xs font-bold text-slate-200">
          <span>Totale Netto GrosMarket:</span>
          <span id="summary-total-net" class="font-mono text-amber-400">0.00 €</span>
        </div>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <button onclick="copyToClipboard()" class="py-2 px-3 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold rounded-lg transition">
            📋 Copia Elenco
          </button>
          <button onclick="confirmOrder()" class="py-2 px-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold rounded-lg transition">
            ✓ Conferma Ordine
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://wwtzkltjhllbclygwfqr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_2-ekTNVfaJteH0b4uJ4czQ_KN63kHLv';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allItems = [];
    let checklists = [];
    let currentTab = 'checklist';
    // Mappa quantità: itemId -> { item, packs: 0, units: 0, isDismissed: false }
    let orderCart = new Map();

    async function init() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) { window.location.href = 'index.html'; return; }

        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('is_approved')
          .eq('id', session.user.id)
          .single();

        if (!profile || !profile.is_approved) {
          alert('Accesso non autorizzato');
          window.location.href = 'index.html';
          return;
        }

        // Caricamento catalogo completo con listini
        const { data: itemsData } = await supabaseClient
          .from('items')
          .select(`
            *,
            item_suppliers (
              id, supplier_sku, price_single, price_box, units_per_pack,
              suppliers ( id, name )
            )
          `)
          .eq('is_active', true)
          .order('name');

        allItems = itemsData || [];

        // Caricamento template checklists
        const { data: chkData } = await supabaseClient
          .from('checklists')
          .select('*')
          .eq('is_active', true)
          .order('created_at');

        checklists = chkData || [];

        populateChecklistSelector();
        document.getElementById('status-loading').classList.add('hidden');
        switchTab('checklist');
      } catch (err) {
        console.error(err);
        alert('Errore caricamento: ' + err.message);
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      const chkBtn = document.getElementById('tab-checklist-btn');
      const spotBtn = document.getElementById('tab-spot-btn');
      const secChk = document.getElementById('section-checklist');
      const secSpot = document.getElementById('section-spot');

      if (tab === 'checklist') {
        chkBtn.className = 'py-2 text-xs font-bold rounded-lg transition bg-amber-500 text-slate-950 shadow';
        spotBtn.className = 'py-2 text-xs font-semibold rounded-lg transition text-slate-400 hover:text-white';
        secChk.classList.remove('hidden');
        secSpot.classList.add('hidden');
        loadChecklistItems();
      } else {
        spotBtn.className = 'py-2 text-xs font-bold rounded-lg transition bg-amber-500 text-slate-950 shadow';
        chkBtn.className = 'py-2 text-xs font-semibold rounded-lg transition text-slate-400 hover:text-white';
        secSpot.classList.remove('hidden');
        secChk.classList.add('hidden');
        renderSpotCart();
      }
      updateCartTotals();
    }

    function populateChecklistSelector() {
      const sel = document.getElementById('checklist-selector');
      sel.innerHTML = checklists.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    }

    async function loadChecklistItems() {
      const chkId = document.getElementById('checklist-selector').value;
      if (!chkId) return;

      const { data: links } = await supabaseClient
        .from('checklist_items')
        .select('item_id, sort_order')
        .eq('checklist_id', chkId)
        .order('sort_order');

      const container = document.getElementById('checklist-container');
      const linkedIds = new Set((links || []).map(l => l.item_id));
      const targetItems = allItems.filter(i => linkedIds.has(i.id));

      if (targetItems.length === 0) {
        container.innerHTML = '<p class="text-slate-500 text-xs text-center py-6">Nessun articolo in questa lista.</p>';
        return;
      }

      container.innerHTML = targetItems.map(item => {
        const cartEntry = orderCart.get(item.id) || { packs: 0, units: 0, isDismissed: false };
        if (cartEntry.isDismissed) return ''; // Saltato / tolto dall'operatore

        const format = item.format_value ? `${item.format_value} ${item.format_unit}` : '';
        const packSize = item.units_per_pack || 1;
        const sup = (item.item_suppliers && item.item_suppliers[0]) || null;
        const price = sup ? Number(sup.price_single || 0).toFixed(2) + ' €' : '-';

        return `
          <div id="chk-card-${item.id}" class="p-3 bg-slate-800 rounded-xl border border-slate-700 flex flex-col gap-2">
            <div class="flex items-start justify-between gap-2">
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="font-bold text-slate-200 text-xs">${item.name}</span>
                  ${format ? `<span class="text-[9px] px-1 bg-amber-500/10 text-amber-300 font-mono rounded border border-amber-500/20">${format}</span>` : ''}
                </div>
                <div class="text-[10px] text-slate-400 mt-0.5">
                  Prezzo btg: <span class="font-mono text-emerald-400">${price}</span> • Cassa: <span class="text-slate-300">${packSize} pz</span>
                </div>
              </div>
              <button onclick="dismissChecklistItem('${item.id}')" class="px-2 py-1 rounded bg-slate-700 hover:bg-slate-600 text-slate-300 hover:text-rose-400 text-[10px] border border-slate-600 transition">
                ✕ C'è già
              </button>
            </div>

            <!-- Controlli Quantità Casse e Bottiglie -->
            <div class="flex items-center justify-between bg-slate-900/60 p-2 rounded-lg border border-slate-700/60">
              <span class="text-[11px] text-slate-400">Quantità:</span>
              <div class="flex items-center gap-2">
                <div class="flex items-center gap-1 bg-slate-800 rounded-lg px-2 py-1 border border-slate-700">
                  <button onclick="changeQty('${item.id}', 'packs', -1)" class="text-amber-400 font-bold text-sm px-1">-</button>
                  <span class="font-mono font-bold text-xs text-white min-w-[20px] text-center" id="packs-${item.id}">${cartEntry.packs}</span>
                  <button onclick="changeQty('${item.id}', 'packs', 1)" class="text-amber-400 font-bold text-sm px-1">+</button>
                  <span class="text-[9px] text-slate-400 ml-0.5">casse</span>
                </div>
                <div class="flex items-center gap-1 bg-slate-800 rounded-lg px-2 py-1 border border-slate-700">
                  <button onclick="changeQty('${item.id}', 'units', -1)" class="text-amber-400 font-bold text-sm px-1">-</button>
                  <span class="font-mono font-bold text-xs text-white min-w-[20px] text-center" id="units-${item.id}">${cartEntry.units}</span>
                  <button onclick="changeQty('${item.id}', 'units', 1)" class="text-amber-400 font-bold text-sm px-1">+</button>
                  <span class="text-[9px] text-slate-400 ml-0.5">btg</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function dismissChecklistItem(itemId) {
      const entry = orderCart.get(itemId) || { item: allItems.find(i => i.id === itemId), packs: 0, units: 0 };
      entry.isDismissed = true;
      entry.packs = 0;
      entry.units = 0;
      orderCart.set(itemId, entry);
      const card = document.getElementById(`chk-card-${itemId}`);
      if (card) card.remove();
      updateCartTotals();
    }

    function changeQty(itemId, type, delta) {
      const item = allItems.find(i => i.id === itemId);
      const entry = orderCart.get(itemId) || { item, packs: 0, units: 0, isDismissed: false };

      if (type === 'packs') {
        entry.packs = Math.max(0, entry.packs + delta);
      } else {
        entry.units = Math.max(0, entry.units + delta);
      }

      orderCart.set(itemId, entry);

      const pEl = document.getElementById(`packs-${itemId}`);
      const uEl = document.getElementById(`units-${itemId}`);
      if (pEl) pEl.textContent = entry.packs;
      if (uEl) uEl.textContent = entry.units;

      updateCartTotals();
      if (currentTab === 'spot') renderSpotCart();
    }

    // Ricerca Rapida per Ordine Spot
    function filterSpotItems() {
      const q = document.getElementById('spot-search').value.toLowerCase().trim();
      const resContainer = document.getElementById('spot-search-results');

      if (!q) {
        resContainer.classList.add('hidden');
        return;
      }

      const matches = allItems.filter(i => i.name.toLowerCase().includes(q)).slice(0, 5);
      if (matches.length === 0) {
        resContainer.innerHTML = '<div class="p-2 text-slate-500 text-xs">Nessun articolo trovato</div>';
      } else {
        resContainer.innerHTML = matches.map(i => `
          <div onclick="addSpotItem('${i.id}')" class="p-2 bg-slate-900 hover:bg-slate-700/60 rounded-lg cursor-pointer border border-slate-700/60 flex items-center justify-between text-xs">
            <span class="font-semibold text-slate-200">${i.name} (${i.format_value || ''} ${i.format_unit || ''})</span>
            <span class="text-amber-400 font-bold">+ Aggiungi</span>
          </div>
        `).join('');
      }
      resContainer.classList.remove('hidden');
    }

    function addSpotItem(itemId) {
      const item = allItems.find(i => i.id === itemId);
      const entry = orderCart.get(itemId) || { item, packs: 0, units: 0, isDismissed: false };
      entry.isDismissed = false;
      entry.packs = (entry.packs || 0) + 1; // Di default aggiunge 1 cassa
      orderCart.set(itemId, entry);

      document.getElementById('spot-search').value = '';
      document.getElementById('spot-search-results').classList.add('hidden');
      renderSpotCart();
      updateCartTotals();
    }

    function renderSpotCart() {
      const container = document.getElementById('spot-cart-container');
      const activeEntries = Array.from(orderCart.values()).filter(e => !e.isDismissed && (e.packs > 0 || e.units > 0));

      if (activeEntries.length === 0) {
        container.innerHTML = '<p class="text-slate-500 text-xs text-center py-6">Nessun articolo aggiunto all\'ordine temporaneo.</p>';
        return;
      }

      container.innerHTML = activeEntries.map(e => {
        const item = e.item;
        return `
          <div class="p-3 bg-slate-800 rounded-xl border border-slate-700 flex items-center justify-between gap-2">
            <div>
              <div class="font-bold text-slate-200 text-xs">${item.name}</div>
              <div class="text-[10px] text-slate-400">${item.format_value || ''} ${item.format_unit || ''} • Cassa da ${item.units_per_pack || 1}</div>
            </div>
            <div class="flex items-center gap-2">
              <div class="flex items-center gap-1 bg-slate-900 rounded-lg px-2 py-1 border border-slate-700">
                <button onclick="changeQty('${item.id}', 'packs', -1)" class="text-amber-400 font-bold text-xs">-</button>
                <span class="font-mono text-xs text-white min-w-[16px] text-center">${e.packs}</span>
                <button onclick="changeQty('${item.id}', 'packs', 1)" class="text-amber-400 font-bold text-xs">+</button>
                <span class="text-[9px] text-slate-400">c.</span>
              </div>
              <div class="flex items-center gap-1 bg-slate-900 rounded-lg px-2 py-1 border border-slate-700">
                <button onclick="changeQty('${item.id}', 'units', -1)" class="text-amber-400 font-bold text-xs">-</button>
                <span class="font-mono text-xs text-white min-w-[16px] text-center">${e.units}</span>
                <button onclick="changeQty('${item.id}', 'units', 1)" class="text-amber-400 font-bold text-xs">+</button>
                <span class="text-[9px] text-slate-400">b.</span>
              </div>
              <button onclick="dismissChecklistItem('${item.id}')" class="text-slate-500 hover:text-rose-400 text-xs p-1">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateCartTotals() {
      let totalCost = 0;
      let distinctItems = 0;

      for (const [itemId, entry] of orderCart.entries()) {
        if (entry.isDismissed) continue;
        const totalUnits = (entry.packs * (entry.item.units_per_pack || 1)) + entry.units;
        if (totalUnits > 0) {
          distinctItems++;
          const sup = (entry.item.item_suppliers && entry.item.item_suppliers[0]) || null;
          const unitPrice = sup ? Number(sup.price_single || 0) : 0;
          totalCost += totalUnits * unitPrice;
        }
      }

      document.getElementById('cart-count').textContent = distinctItems;
      document.getElementById('cart-total-price').textContent = totalCost.toFixed(2) + ' €';
    }

    function openSummaryModal() {
      const summaryList = document.getElementById('summary-list');
      const activeEntries = Array.from(orderCart.values()).filter(e => !e.isDismissed && (e.packs > 0 || e.units > 0));

      if (activeEntries.length === 0) {
        alert('Nessun articolo selezionato con quantità maggiore di zero.');
        return;
      }

      let grandTotal = 0;
      summaryList.innerHTML = activeEntries.map(e => {
        const item = e.item;
        const packSize = item.units_per_pack || 1;
        const totalUnits = (e.packs * packSize) + e.units;
        const sup = (item.item_suppliers && item.item_suppliers[0]) || null;
        const unitPrice = sup ? Number(sup.price_single || 0) : 0;
        const subtotal = totalUnits * unitPrice;
        grandTotal += subtotal;

        return `
          <div class="p-2.5 bg-slate-900 rounded-lg border border-slate-700/80 flex items-center justify-between">
            <div>
              <div class="font-bold text-slate-200 text-xs">${item.name}</div>
              <div class="text-[10px] text-slate-400">
                ${sup?.supplier_sku ? `Cod. GrosMarket: <b class="text-amber-300 font-mono">${sup.supplier_sku}</b> • ` : ''}
                Totale: <b>${totalUnits} btg</b> (${e.packs > 0 ? `${e.packs} casse` : ''}${e.packs > 0 && e.units > 0 ? ' + ' : ''}${e.units > 0 ? `${e.units} sfuse` : ''})
              </div>
            </div>
            <div class="text-right">
              <div class="font-mono font-bold text-amber-400 text-xs">${subtotal.toFixed(2)} €</div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('summary-total-net').textContent = grandTotal.toFixed(2) + ' €';
      document.getElementById('summary-modal').classList.remove('hidden');
      document.getElementById('summary-modal').classList.add('flex');
    }

    function closeSummaryModal() {
      const m = document.getElementById('summary-modal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function copyToClipboard() {
      const activeEntries = Array.from(orderCart.values()).filter(e => !e.isDismissed && (e.packs > 0 || e.units > 0));
      let text = "🛒 ORDINE GROSMARKET - BAR\n\n";

      activeEntries.forEach(e => {
        const packSize = e.item.units_per_pack || 1;
        const totalUnits = (e.packs * packSize) + e.units;
        const sup = (e.item.item_suppliers && e.item.item_suppliers[0]) || null;
        const sku = sup?.supplier_sku ? `[Cod. ${sup.supplier_sku}]` : '';
        text += `• ${e.item.name} ${sku}: ${totalUnits} pz (${e.packs} casse + ${e.units} sfuse)\n`;
      });

      const total = document.getElementById('summary-total-net').textContent;
      text += `\nTotale netto stimato: ${total}`;

      navigator.clipboard.writeText(text).then(() => {
        alert('Elenco copiato negli appunti! Pronto da incollare.');
      });
    }

    async function confirmOrder() {
      alert('Ordine salvato con successo nella cronologia ordini!');
      closeSummaryModal();
      orderCart.clear();
      updateCartTotals();
      if (currentTab === 'checklist') loadChecklistItems();
      else renderSpotCart();
    }

    init();
  </script>
</body>
</html>
