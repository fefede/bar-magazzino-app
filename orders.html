<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ordini & Verifiche - Bar Magazzino</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-start p-3 pb-24">

  <div class="w-full max-w-lg space-y-4">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-700 pb-3">
      <div>
        <h1 class="text-lg font-bold text-amber-400">Ordini & Verifiche</h1>
        <p class="text-[11px] text-slate-400">Gestione ordini per singolo fornitore</p>
      </div>
      <a href="index.html" class="text-xs text-slate-300 hover:text-white py-1.5 px-3 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition">← Dashboard</a>
    </div>

    <!-- SELETTORE FORNITORE PRINCIPALE (Vincolo ordine a un solo fornitore) -->
    <div class="bg-slate-800 p-3 rounded-xl border border-amber-500/30 space-y-1 shadow-sm">
      <div class="flex items-center justify-between">
        <label class="text-[11px] font-bold text-amber-400 uppercase tracking-wider">Fornitore di destinazione *</label>
        <span class="text-[10px] text-slate-400">1 ordine = 1 fornitore</span>
      </div>
      <select id="supplier-selector" onchange="onSupplierChange()" class="w-full p-2 bg-slate-900 border border-slate-700 text-xs font-semibold rounded-lg text-slate-100 focus:outline-none focus:border-amber-400"></select>
    </div>

    <!-- Selettore Modalità (Tab) -->
    <div class="grid grid-cols-2 gap-2 bg-slate-800/90 p-1 rounded-xl border border-slate-700">
      <button id="tab-checklist-btn" onclick="switchTab('checklist')" class="py-2 text-xs font-bold rounded-lg transition bg-amber-500 text-slate-950 shadow">
        📋 Verifica da Lista
      </button>
      <button id="tab-spot-btn" onclick="switchTab('spot')" class="py-2 text-xs font-semibold rounded-lg transition text-slate-400 hover:text-white">
        ⚡ Ordine Spot (Rapido)
      </button>
    </div>

    <!-- CARICAMENTO -->
    <div id="status-loading" class="py-12 text-center text-sm text-slate-400">
      <div class="inline-block w-6 h-6 border-2 border-amber-400 border-t-transparent rounded-full animate-spin mb-2"></div>
      <p>Caricamento listini e articoli...</p>
    </div>

    <!-- SEZIONE 1: VERIFICA DA LISTA -->
    <div id="section-checklist" class="hidden space-y-3">
      <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex items-center justify-between gap-2">
        <label class="text-xs text-slate-400 whitespace-nowrap">Template Lista:</label>
        <select id="checklist-selector" onchange="loadChecklistItems()" class="w-full p-2 bg-slate-900 border border-slate-700 text-xs rounded-lg text-amber-300 focus:outline-none focus:border-amber-400"></select>
      </div>
      <div id="checklist-container" class="space-y-2"></div>
    </div>

    <!-- SEZIONE 2: ORDINE SPOT -->
    <div id="section-spot" class="hidden space-y-3">
      <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 space-y-2">
        <label class="text-xs text-slate-400">Cerca articolo da ordinare:</label>
        <input type="text" id="spot-search" oninput="filterSpotItems()" placeholder="Es. Campari, Lucano, Tonica..." class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-400" />
        <div id="spot-search-results" class="max-h-52 overflow-y-auto space-y-1 pt-1 hidden"></div>
      </div>
      <div id="spot-cart-container" class="space-y-2">
        <p class="text-slate-500 text-xs text-center py-6">Nessun articolo aggiunto all'ordine spot.</p>
      </div>
    </div>
  </div>

  <!-- BARRA FISSA IN BASSO: RIEPILOGO & INVIA -->
  <div id="bottom-bar" class="fixed bottom-0 left-0 right-0 bg-slate-800/95 backdrop-blur border-t border-slate-700 p-3 flex items-center justify-between max-w-lg mx-auto z-40">
    <div>
      <div class="text-[11px] text-slate-400">Totale (<span id="cart-count">0</span> art.):</div>
      <div class="text-base font-bold font-mono text-amber-400" id="cart-total-price">0.00 €</div>
    </div>
    <button onclick="openSummaryModal()" class="px-4 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs rounded-xl shadow-lg transition active:scale-95 flex items-center gap-1.5">
      <span>Riepilogo Ordine</span> →
    </button>
  </div>

  <!-- MODAL RIEPILOGO E INVIO ORDINE -->
  <div id="summary-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">
    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl p-5 border border-slate-700 space-y-4 max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between border-b border-slate-700 pb-2">
        <div>
          <h3 class="font-bold text-amber-400 text-sm">Riepilogo Ordine</h3>
          <p id="summary-supplier-label" class="text-[10px] text-slate-300 font-medium"></p>
        </div>
        <button onclick="closeSummaryModal()" class="text-slate-400 hover:text-white text-lg">✕</button>
      </div>

      <div id="summary-list" class="overflow-y-auto space-y-2 text-xs flex-1 pr-1"></div>

      <div class="border-t border-slate-700 pt-3 space-y-2">
        <div class="flex justify-between text-xs font-bold text-slate-200">
          <span>Totale Netto Fornitore:</span>
          <span id="summary-total-net" class="font-mono text-amber-400">0.00 €</span>
        </div>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <button onclick="copyToClipboard()" class="py-2 px-3 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold rounded-lg transition">
            📋 Copia Elenco
          </button>
          <button onclick="confirmOrder()" class="py-2 px-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold rounded-lg transition">
            ✓ Conferma Ordine
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://wwtzkltjhllbclygwfqr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_2-ekTNVfaJteH0b4uJ4czQ_KN63kHLv';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allItems = [];
    let suppliers = [];
    let checklists = [];
    let currentTab = 'checklist';
    let selectedSupplierId = '';
    let orderCart = new Map();

    async function init() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) { window.location.href = 'index.html'; return; }

        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('is_approved')
          .eq('id', session.user.id)
          .single();

        if (!profile || !profile.is_approved) {
          alert('Accesso non autorizzato');
          window.location.href = 'index.html';
          return;
        }

        // Carica anagrafica fornitori
        const { data: supData, error: supErr } = await supabaseClient
          .from('suppliers')
          .select('id, name')
          .order('name');
        if (supErr) throw supErr;
        suppliers = supData || [];

        // Carica catalogo con listini
        const { data: itemsData, error: itemsErr } = await supabaseClient
          .from('items')
          .select(`
            id,
            name,
            category,
            unit_type,
            format_value,
            format_unit,
            units_per_pack,
            min_stock,
            target_stock,
            is_active,
            item_suppliers (
              id,
              supplier_id,
              supplier_sku,
              price_single,
              price_box,
              vat_rate,
              is_preferred
            )
          `)
          .eq('is_active', true)
          .order('name');

        if (itemsErr) throw itemsErr;
        allItems = itemsData || [];

        // Carica template checklists
        const { data: chkData } = await supabaseClient
          .from('checklists')
          .select('*')
          .eq('is_active', true)
          .order('created_at');

        checklists = chkData || [];

        populateSupplierSelector();
        populateChecklistSelector();

        document.getElementById('status-loading').classList.add('hidden');
        switchTab('checklist');
      } catch (err) {
        console.error('Errore avvio:', err);
        alert('Errore caricamento: ' + err.message);
      }
    }

    function populateSupplierSelector() {
      const sel = document.getElementById('supplier-selector');
      if (suppliers.length === 0) {
        sel.innerHTML = '<option value="">Nessun fornitore registrato</option>';
        return;
      }
      sel.innerHTML = suppliers.map((s, idx) => `<option value="${s.id}">${s.name}</option>`).join('');
      // GrosMarket di default se presente
      const gros = suppliers.find(s => s.name.toLowerCase().includes('grosmarket'));
      selectedSupplierId = gros ? gros.id : suppliers[0].id;
      sel.value = selectedSupplierId;
    }

    function onSupplierChange() {
      selectedSupplierId = document.getElementById('supplier-selector').value;
      // Ricarica la vista attiva per ricalcolare prezzi e subtotali
      if (currentTab === 'checklist') loadChecklistItems();
      else renderSpotCart();
      updateCartTotals();
    }

    function getSupplierInfo(item) {
      const links = item.item_suppliers || [];
      const match = links.find(l => l.supplier_id === selectedSupplierId);
      if (match) {
        return {
          hasPrice: !!match.price_single,
          priceSingle: match.price_single ? Number(match.price_single) : 0,
          priceBox: match.price_box ? Number(match.price_box) : 0,
          sku: match.supplier_sku || ''
        };
      }
      return {
        hasPrice: false,
        priceSingle: 0,
        priceBox: 0,
        sku: ''
      };
    }

    function switchTab(tab) {
      currentTab = tab;
      const chkBtn = document.getElementById('tab-checklist-btn');
      const spotBtn = document.getElementById('tab-spot-btn');
      const secChk = document.getElementById('section-checklist');
      const secSpot = document.getElementById('section-spot');

      if (tab === 'checklist') {
        chkBtn.className = 'py-2 text-xs font-bold rounded-lg transition bg-amber-500 text-slate-950 shadow';
        spotBtn.className = 'py-2 text-xs font-semibold rounded-lg transition text-slate-400 hover:text-white';
        secChk.classList.remove('hidden');
        secSpot.classList.add('hidden');
        loadChecklistItems();
      } else {
        spotBtn.className = 'py-2 text-xs font-bold rounded-lg transition bg-amber-500 text-slate-950 shadow';
        chkBtn.className = 'py-2 text-xs font-semibold rounded-lg transition text-slate-400 hover:text-white';
        secSpot.classList.remove('hidden');
        secChk.classList.add('hidden');
        renderSpotCart();
        setTimeout(() => document.getElementById('spot-search')?.focus(), 100);
      }
      updateCartTotals();
    }

    function populateChecklistSelector() {
      const sel = document.getElementById('checklist-selector');
      if (checklists.length === 0) {
        sel.innerHTML = '<option value="">Nessuna lista trovata</option>';
        return;
      }
      sel.innerHTML = checklists.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    }

    async function loadChecklistItems() {
      const chkId = document.getElementById('checklist-selector').value;
      const container = document.getElementById('checklist-container');
      if (!chkId) {
        container.innerHTML = '<p class="text-slate-500 text-xs text-center py-6">Nessuna lista selezionata.</p>';
        return;
      }

      const { data: links, error: linkErr } = await supabaseClient
        .from('checklist_items')
        .select('item_id, sort_order')
        .eq('checklist_id', chkId)
        .order('sort_order');

      if (linkErr) {
        container.innerHTML = `<p class="text-rose-400 text-xs text-center py-4">Errore: ${linkErr.message}</p>`;
        return;
      }

      const linkedIds = new Set((links || []).map(l => l.item_id));
      const targetItems = allItems.filter(i => linkedIds.has(i.id));

      if (targetItems.length === 0) {
        container.innerHTML = '<p class="text-slate-500 text-xs text-center py-6">Nessun articolo associato a questa lista.</p>';
        return;
      }

      container.innerHTML = targetItems.map(item => {
        const cartEntry = orderCart.get(item.id) || { item, packs: 0, units: 0, isDismissed: false };
        if (cartEntry.isDismissed) return '';

        const format = item.format_value ? `${item.format_value} ${item.format_unit || ''}` : '';
        const packSize = item.units_per_pack || 1;
        const supInfo = getSupplierInfo(item);

        return `
          <div id="chk-card-${item.id}" class="p-3 bg-slate-800 rounded-xl border border-slate-700 flex flex-col gap-2">
            <div class="flex items-start justify-between gap-2">
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="font-bold text-slate-200 text-xs">${item.name}</span>
                  ${format ? `<span class="text-[9px] px-1 bg-amber-500/10 text-amber-300 font-mono rounded border border-amber-500/20">${format}</span>` : ''}
                </div>
                <div class="text-[10px] text-slate-400 mt-0.5">
                  ${supInfo.hasPrice 
                    ? `Prezzo: <span class="font-mono text-emerald-400 font-bold">${supInfo.priceSingle.toFixed(2)} €</span>${supInfo.sku ? ` • SKU: <span class="font-mono text-slate-300">${supInfo.sku}</span>` : ''}` 
                    : `<span class="text-slate-500 italic">Nessun prezzo fornitore</span>`} 
                  • Cassa: <span class="text-slate-300">${packSize} pz</span>
                </div>
              </div>
              <button onclick="dismissChecklistItem('${item.id}')" class="px-2 py-1 rounded bg-slate-700 hover:bg-slate-600 text-slate-300 hover:text-rose-400 text-[10px] border border-slate-600 transition">
                ✕ C'è già
              </button>
            </div>

            <div class="flex items-center justify-between bg-slate-900/60 p-2 rounded-lg border border-slate-700/60">
              <span class="text-[11px] text-slate-400">Quantità da ordinare:</span>
              <div class="flex items-center gap-2">
                <div class="flex items-center gap-1 bg-slate-800 rounded-lg px-2 py-1 border border-slate-700">
                  <button onclick="changeQty('${item.id}', 'packs', -1)" class="text-amber-400 font-bold text-sm px-1.5 active:scale-90">-</button>
                  <span class="font-mono font-bold text-xs text-white min-w-[20px] text-center" id="packs-${item.id}">${cartEntry.packs}</span>
                  <button onclick="changeQty('${item.id}', 'packs', 1)" class="text-amber-400 font-bold text-sm px-1.5 active:scale-90">+</button>
                  <span class="text-[9px] text-slate-400 ml-0.5">casse</span>
                </div>
                <div class="flex items-center gap-1 bg-slate-800 rounded-lg px-2 py-1 border border-slate-700">
                  <button onclick="changeQty('${item.id}', 'units', -1)" class="text-amber-400 font-bold text-sm px-1.5 active:scale-90">-</button>
                  <span class="font-mono font-bold text-xs text-white min-w-[20px] text-center" id="units-${item.id}">${cartEntry.units}</span>
                  <button onclick="changeQty('${item.id}', 'units', 1)" class="text-amber-400 font-bold text-sm px-1.5 active:scale-90">+</button>
                  <span class="text-[9px] text-slate-400 ml-0.5">btg</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function dismissChecklistItem(itemId) {
      const item = allItems.find(i => i.id === itemId);
      const entry = orderCart.get(itemId) || { item, packs: 0, units: 0 };
      entry.isDismissed = true;
      entry.packs = 0;
      entry.units = 0;
      orderCart.set(itemId, entry);
      const card = document.getElementById(`chk-card-${itemId}`);
      if (card) card.remove();
      updateCartTotals();
    }

    function changeQty(itemId, type, delta) {
      const item = allItems.find(i => i.id === itemId);
      if (!item) return;

      const entry = orderCart.get(itemId) || { item, packs: 0, units: 0, isDismissed: false };
      entry.isDismissed = false;

      if (type === 'packs') {
        entry.packs = Math.max(0, (entry.packs || 0) + delta);
      } else {
        entry.units = Math.max(0, (entry.units || 0) + delta);
      }

      orderCart.set(itemId, entry);

      const pEl = document.getElementById(`packs-${itemId}`);
      const uEl = document.getElementById(`units-${itemId}`);
      if (pEl) pEl.textContent = entry.packs;
      if (uEl) uEl.textContent = entry.units;

      updateCartTotals();
      if (currentTab === 'spot') renderSpotCart();
    }

    function filterSpotItems() {
      const input = document.getElementById('spot-search');
      const q = (input ? input.value : '').toLowerCase().trim();
      const resContainer = document.getElementById('spot-search-results');

      if (!q) {
        resContainer.innerHTML = '';
        resContainer.classList.add('hidden');
        return;
      }

      const matches = allItems.filter(i => {
        const nameMatch = i.name.toLowerCase().includes(q);
        const skuMatch = (i.item_suppliers || []).some(s => 
          s.supplier_id === selectedSupplierId && (s.supplier_sku || '').toLowerCase().includes(q)
        );
        return nameMatch || skuMatch;
      }).slice(0, 6);
      
      if (matches.length === 0) {
        resContainer.innerHTML = '<div class="p-2.5 text-slate-400 text-xs bg-slate-900 rounded-lg border border-slate-700">Nessun articolo trovato</div>';
      } else {
        resContainer.innerHTML = matches.map(i => {
          const format = i.format_value ? `${i.format_value} ${i.format_unit || ''}` : '';
          const supInfo = getSupplierInfo(i);

          return `
            <div onclick="addSpotItem('${i.id}')" class="p-2.5 bg-slate-900 hover:bg-slate-700 rounded-lg cursor-pointer border border-slate-700 flex items-center justify-between transition">
              <div>
                <span class="font-semibold text-slate-200 text-xs">${i.name}</span>
                ${format ? `<span class="text-[10px] text-amber-300 ml-1">(${format})</span>` : ''}
                <div class="text-[10px] text-slate-400 mt-0.5">
                  ${supInfo.hasPrice ? `${supInfo.priceSingle.toFixed(2)} €/btg` : 'Senza listino'} 
                  ${supInfo.sku ? `• Cod: ${supInfo.sku}` : ''}
                </div>
              </div>
              <span class="text-amber-400 font-bold text-xs bg-amber-500/10 px-2 py-1 rounded border border-amber-500/20">+ Aggiungi</span>
            </div>
          `;
        }).join('');
      }
      resContainer.classList.remove('hidden');
    }

    function addSpotItem(itemId) {
      const item = allItems.find(i => i.id === itemId);
      if (!item) return;

      const entry = orderCart.get(itemId) || { item, packs: 0, units: 0, isDismissed: false };
      entry.isDismissed = false;
      entry.packs = (entry.packs || 0) + 1;
      orderCart.set(itemId, entry);

      const input = document.getElementById('spot-search');
      if (input) input.value = '';
      const resContainer = document.getElementById('spot-search-results');
      if (resContainer) {
        resContainer.innerHTML = '';
        resContainer.classList.add('hidden');
      }

      renderSpotCart();
      updateCartTotals();
    }

    function removeSpotItem(itemId) {
      orderCart.delete(itemId);
      renderSpotCart();
      updateCartTotals();
    }

    function renderSpotCart() {
      const container = document.getElementById('spot-cart-container');
      const activeEntries = Array.from(orderCart.values()).filter(e => !e.isDismissed && (e.packs > 0 || e.units > 0));

      if (activeEntries.length === 0) {
        container.innerHTML = '<p class="text-slate-500 text-xs text-center py-8">Nessun articolo aggiunto all\'ordine spot.<br><span class="text-[11px] text-slate-600">Cerca un prodotto qui sopra per aggiungerlo.</span></p>';
        return;
      }

      container.innerHTML = activeEntries.map(e => {
        const item = e.item;
        const format = item.format_value ? `${item.format_value} ${item.format_unit || ''}` : '';
        const packSize = item.units_per_pack || 1;
        const supInfo = getSupplierInfo(item);
        const totalUnits = (e.packs * packSize) + e.units;
        const rowTotal = totalUnits * supInfo.priceSingle;

        return `
          <div class="p-3 bg-slate-800 rounded-xl border border-slate-700 flex items-center justify-between gap-2 shadow-sm">
            <div class="min-w-0 flex-1">
              <div class="font-bold text-slate-200 text-xs truncate">${item.name}</div>
              <div class="text-[10px] text-slate-400 mt-0.5">
                ${format ? `${format} • ` : ''}Cassa da ${packSize} pz 
                ${supInfo.hasPrice 
                  ? `• <span class="text-amber-400 font-mono font-bold">${rowTotal.toFixed(2)} €</span>` 
                  : `• <span class="text-slate-500 italic">prezzo non disp.</span>`}
              </div>
            </div>
            
            <div class="flex items-center gap-2 shrink-0">
              <div class="flex items-center gap-1 bg-slate-900 rounded-lg px-2 py-1 border border-slate-700">
                <button onclick="changeQty('${item.id}', 'packs', -1)" class="text-amber-400 font-bold text-xs px-1 active:scale-90">-</button>
                <span class="font-mono text-xs font-bold text-white min-w-[16px] text-center">${e.packs}</span>
                <button onclick="changeQty('${item.id}', 'packs', 1)" class="text-amber-400 font-bold text-xs px-1 active:scale-90">+</button>
                <span class="text-[9px] text-slate-400">c.</span>
              </div>
              <div class="flex items-center gap-1 bg-slate-900 rounded-lg px-2 py-1 border border-slate-700">
                <button onclick="changeQty('${item.id}', 'units', -1)" class="text-amber-400 font-bold text-xs px-1 active:scale-90">-</button>
                <span class="font-mono text-xs font-bold text-white min-w-[16px] text-center">${e.units}</span>
                <button onclick="changeQty('${item.id}', 'units', 1)" class="text-amber-400 font-bold text-xs px-1 active:scale-90">+</button>
                <span class="text-[9px] text-slate-400">b.</span>
              </div>
              <button onclick="removeSpotItem('${item.id}')" title="Rimuovi" class="text-slate-500 hover:text-rose-400 p-1 text-sm leading-none ml-1">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateCartTotals() {
      let totalCost = 0;
      let distinctItems = 0;

      for (const [itemId, entry] of orderCart.entries()) {
        if (entry.isDismissed) continue;
        const totalUnits = (entry.packs * (entry.item?.units_per_pack || 1)) + entry.units;
        if (totalUnits > 0) {
          distinctItems++;
          const supInfo = getSupplierInfo(entry.item);
          totalCost += totalUnits * supInfo.priceSingle;
        }
      }

      const countEl = document.getElementById('cart-count');
      const totalEl = document.getElementById('cart-total-price');
      if (countEl) countEl.textContent = distinctItems;
      if (totalEl) totalEl.textContent = totalCost.toFixed(2) + ' €';
    }

    function openSummaryModal() {
      const activeEntries = Array.from(orderCart.values()).filter(e => !e.isDismissed && (e.packs > 0 || e.units > 0));

      if (activeEntries.length === 0) {
        alert('Nessun articolo selezionato con quantità maggiore di zero.');
        return;
      }

      const curSup = suppliers.find(s => s.id === selectedSupplierId);
      const supName = curSup ? curSup.name : 'Fornitore';
      document.getElementById('summary-supplier-label').textContent = `Fornitore: ${supName}`;

      let grandTotal = 0;
      const summaryList = document.getElementById('summary-list');

      summaryList.innerHTML = activeEntries.map(e => {
        const item = e.item;
        const packSize = item.units_per_pack || 1;
        const totalUnits = (e.packs * packSize) + e.units;
        const supInfo = getSupplierInfo(item);
        const subtotal = totalUnits * supInfo.priceSingle;
        grandTotal += subtotal;

        return `
          <div class="p-2.5 bg-slate-900 rounded-lg border border-slate-700/80 flex items-center justify-between">
            <div>
              <div class="font-bold text-slate-200 text-xs">${item.name}</div>
              <div class="text-[10px] text-slate-400">
                ${supInfo.sku ? `Cod. SKU: <b class="text-amber-300 font-mono">${supInfo.sku}</b> • ` : ''}
                Totale: <b>${totalUnits} btg</b> (${e.packs > 0 ? `${e.packs} casse` : ''}${e.packs > 0 && e.units > 0 ? ' + ' : ''}${e.units > 0 ? `${e.units} sfuse` : ''})
              </div>
            </div>
            <div class="text-right">
              ${supInfo.hasPrice 
                ? `<div class="font-mono font-bold text-amber-400 text-xs">${subtotal.toFixed(2)} €</div>` 
                : `<div class="text-slate-500 italic text-[11px]">Listino n.d.</div>`}
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('summary-total-net').textContent = grandTotal.toFixed(2) + ' €';
      document.getElementById('summary-modal').classList.remove('hidden');
      document.getElementById('summary-modal').classList.add('flex');
    }

    function closeSummaryModal() {
      const m = document.getElementById('summary-modal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function copyToClipboard() {
      const activeEntries = Array.from(orderCart.values()).filter(e => !e.isDismissed && (e.packs > 0 || e.units > 0));
      const curSup = suppliers.find(s => s.id === selectedSupplierId);
      const supName = curSup ? curSup.name : 'Fornitore';

      let text = `🛒 ORDINE: ${supName.toUpperCase()}\n\n`;

      activeEntries.forEach(e => {
        const packSize = e.item.units_per_pack || 1;
        const totalUnits = (e.packs * packSize) + e.units;
        const supInfo = getSupplierInfo(e.item);
        const sku = supInfo.sku ? `[Cod. ${supInfo.sku}]` : '';
        text += `• ${e.item.name} ${sku}: ${totalUnits} pz (${e.packs} casse + ${e.units} sfuse)\n`;
      });

      const total = document.getElementById('summary-total-net').textContent;
      text += `\nTotale netto stimato: ${total}`;

      navigator.clipboard.writeText(text).then(() => {
        alert(`Elenco per ${supName} copiato negli appunti!`);
      });
    }

    async function confirmOrder() {
      const curSup = suppliers.find(s => s.id === selectedSupplierId);
      alert(`Ordine per ${curSup?.name || 'Fornitore'} verificato con successo!`);
      closeSummaryModal();
    }

    window.switchTab = switchTab;
    window.onSupplierChange = onSupplierChange;
    window.loadChecklistItems = loadChecklistItems;
    window.dismissChecklistItem = dismissChecklistItem;
    window.changeQty = changeQty;
    window.filterSpotItems = filterSpotItems;
    window.addSpotItem = addSpotItem;
    window.removeSpotItem = removeSpotItem;
    window.openSummaryModal = openSummaryModal;
    window.closeSummaryModal = closeSummaryModal;
    window.copyToClipboard = copyToClipboard;
    window.confirmOrder = confirmOrder;

    init();
  </script>
</body>
</html>
