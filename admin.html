<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Admin - Bar Magazzino</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-start p-4">
  <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl p-5 border border-slate-700 my-auto">
    <div class="flex items-center justify-between border-b border-slate-700 pb-3 mb-4">
      <h1 class="text-lg font-bold text-amber-400">Pannello Admin</h1>
      <a href="index.html" class="text-xs text-slate-400 hover:text-white py-1 px-3 border border-slate-700 rounded transition">← Torna all'App</a>
    </div>

    <div id="admin-status" class="py-4 text-center text-sm text-slate-400">
      Verifica permessi in corso...
    </div>

    <div id="users-list" class="space-y-2 text-xs hidden"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://wwtzkltjhllbclygwfqr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_2-ekTNVfaJteH0b4uJ4czQ_KN63kHLv';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const adminStatus = document.getElementById('admin-status');
    const usersList = document.getElementById('users-list');

    async function checkAdmin() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
        return;
      }

      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('is_admin')
        .eq('id', session.user.id)
        .single();

      if (!profile || !profile.is_admin) {
        alert('Accesso negato: area riservata agli amministratori.');
        window.location.href = 'index.html';
        return;
      }

      adminStatus.classList.add('hidden');
      usersList.classList.remove('hidden');
      loadUsers();
    }

    async function toggleApproval(userId, currentStatus) {
      const { error } = await supabaseClient
        .from('profiles')
        .update({ is_approved: !currentStatus })
        .eq('id', userId);

      if (!error) loadUsers();
    }

    async function loadUsers() {
      const { data: users } = await supabaseClient
        .from('profiles')
        .select('*')
        .order('created_at', { ascending: false });

      usersList.innerHTML = users.map(u => `
        <div class="flex items-center justify-between p-2 rounded bg-slate-900 border border-slate-700">
          <div class="truncate mr-2">
            <p class="font-medium text-slate-200 truncate">${u.email}</p>
            <p class="text-[10px] ${u.is_approved ? 'text-emerald-400' : 'text-amber-400'}">
              ${u.is_admin ? '★ Admin • ' : ''}${u.is_approved ? 'Abilitato' : 'In attesa'}
            </p>
          </div>
          ${u.is_admin ? '<span class="text-[10px] text-slate-500">Master</span>' : `
            <button onclick="toggleApproval('${u.id}', ${u.is_approved})" class="px-2.5 py-1 text-[11px] font-semibold rounded ${
              u.is_approved ? 'bg-rose-500/20 text-rose-300' : 'bg-emerald-500/20 text-emerald-300'
            }">
              ${u.is_approved ? 'Revoca' : 'Approva'}
            </button>
          `}
        </div>
      `).join('');
    }

    window.toggleApproval = toggleApproval;
    checkAdmin();
  </script>
</body>
</html>
