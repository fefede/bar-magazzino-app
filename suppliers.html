<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fornitori - Bar Magazzino</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-start p-4">

  <div class="w-full max-w-lg bg-slate-800 rounded-2xl shadow-xl p-5 border border-slate-700 my-auto">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-700 pb-3 mb-4">
      <div>
        <h1 class="text-lg font-bold text-amber-400">Anagrafica Fornitori</h1>
        <p id="role-subtitle" class="text-[11px] text-slate-400">Consultazione contatti</p>
      </div>
      <a href="index.html" class="text-xs text-slate-300 hover:text-white py-1.5 px-3 bg-slate-700 hover:bg-slate-600 rounded-lg border border-slate-600 transition">← Torna all'App</a>
    </div>

    <!-- Stato Caricamento -->
    <div id="status-loading" class="py-8 text-center text-sm text-slate-400">
      <div class="inline-block w-6 h-6 border-2 border-amber-400 border-t-transparent rounded-full animate-spin mb-2"></div>
      <p>Verifica autorizzazioni...</p>
    </div>

    <!-- Sezione Principale -->
    <div id="main-content" class="hidden space-y-5">
      <!-- Form Aggiunta/Modifica Fornitore (Visibile solo agli ADMIN) -->
      <form id="form-supplier" class="hidden bg-slate-900/80 p-4 rounded-xl border border-slate-700 space-y-3 text-xs">
        <div class="flex items-center justify-between">
          <h2 id="form-title" class="font-bold text-amber-400 uppercase tracking-wider text-[11px]">+ Nuovo Fornitore</h2>
          <button type="button" id="btn-cancel-edit" class="hidden text-slate-400 hover:text-rose-400">Annulla modifica</button>
        </div>

        <input type="hidden" id="supplier-id" value="" />

        <div>
          <label class="block text-slate-400 mb-1">Ragione Sociale / Nome Fornitore *</label>
          <input type="text" id="input-name" required placeholder="Es. Grossista Bevande Rossi" class="w-full p-2.5 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400" />
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-400 mb-1">Referente</label>
            <input type="text" id="input-referent" placeholder="Es. Marco" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400" />
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Canale Ordine Predefinito</label>
            <select id="input-method" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-amber-400">
              <option value="whatsapp">WhatsApp</option>
              <option value="email">Email</option>
              <option value="phone">Telefono</option>
              <option value="portal">Portale B2B</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-400 mb-1">Telefono / WhatsApp</label>
            <input type="tel" id="input-phone" placeholder="Es. 3401234567" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400" />
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Email per Ordini</label>
            <input type="email" id="input-email" placeholder="ordini@fornitore.it" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400" />
          </div>
        </div>

        <div>
          <label class="block text-slate-400 mb-1">Note (minimo d'ordine, giorni consegna...)</label>
          <input type="text" id="input-notes" placeholder="Es. Consegna il martedì, min. 150€" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400" />
        </div>

        <button type="submit" id="btn-submit" class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg transition active:scale-95">Salva Fornitore</button>
      </form>

      <!-- Lista Fornitori Esistenti -->
      <div class="space-y-2">
        <div class="flex items-center justify-between text-xs text-slate-400 px-1">
          <span id="suppliers-count">Fornitori registrati: 0</span>
          <button id="btn-refresh" class="text-amber-400 hover:text-amber-300 font-medium">Aggiorna ↻</button>
        </div>
        <div id="suppliers-list" class="space-y-2 text-xs"></div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://wwtzkltjhllbclygwfqr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_2-ekTNVfaJteH0b4uJ4czQ_KN63kHLv';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusLoading = document.getElementById('status-loading');
    const mainContent = document.getElementById('main-content');
    const roleSubtitle = document.getElementById('role-subtitle');
    const suppliersList = document.getElementById('suppliers-list');
    const suppliersCount = document.getElementById('suppliers-count');
    const formSupplier = document.getElementById('form-supplier');
    const formTitle = document.getElementById('form-title');
    const btnCancelEdit = document.getElementById('btn-cancel-edit');
    const btnSubmit = document.getElementById('btn-submit');

    const supplierId = document.getElementById('supplier-id');
    const inputName = document.getElementById('input-name');
    const inputReferent = document.getElementById('input-referent');
    const inputMethod = document.getElementById('input-method');
    const inputPhone = document.getElementById('input-phone');
    const inputEmail = document.getElementById('input-email');
    const inputNotes = document.getElementById('input-notes');

    let suppliersData = [];
    let isUserAdmin = false;

    async function checkUserAccess() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
          window.location.href = 'index.html';
          return;
        }

        const { data: profile, error } = await supabaseClient
          .from('profiles')
          .select('is_admin, is_approved')
          .eq('id', session.user.id)
          .single();

        if (error || !profile || !profile.is_approved) {
          alert('Accesso negato: utenza non abilitata.');
          window.location.href = 'index.html';
          return;
        }

        isUserAdmin = !!profile.is_admin;

        if (isUserAdmin) {
          roleSubtitle.textContent = 'Gestione anagrafica (Privilegi Admin)';
          formSupplier.classList.remove('hidden');
        } else {
          roleSubtitle.textContent = 'Elenco contatti fornitori';
        }

        statusLoading.classList.add('hidden');
        mainContent.classList.remove('hidden');
        loadSuppliers();
      } catch (err) {
        console.error('Errore verifica:', err);
        window.location.href = 'index.html';
      }
    }

    async function loadSuppliers() {
      const { data, error } = await supabaseClient
        .from('suppliers')
        .select('*')
        .order('name', { ascending: true });

      if (error) {
        suppliersList.innerHTML = `<p class="text-rose-400 p-2">Errore caricamento: ${error.message}</p>`;
        return;
      }

      suppliersData = data || [];
      suppliersCount.textContent = `Fornitori registrati: ${suppliersData.length}`;

      if (suppliersData.length === 0) {
        suppliersList.innerHTML = '<p class="text-slate-500 text-center py-4">Nessun fornitore registrato.</p>';
        return;
      }

      suppliersList.innerHTML = suppliersData.map(s => {
        const phoneFormatted = (s.phone || '').replace(/[^0-9+]/g, '');
        return `
        <div class="p-3 rounded-xl bg-slate-900 border border-slate-700/80 space-y-1.5">
          <div class="flex items-start justify-between gap-2">
            <div>
              <p class="font-bold text-slate-200 text-sm">${s.name}</p>
              ${s.referent ? `<p class="text-slate-400 text-[11px]">Rif: ${s.referent}</p>` : ''}
            </div>
            <span class="text-[10px] uppercase font-mono px-2 py-0.5 rounded bg-amber-500/10 text-amber-300 border border-amber-500/20">
              ${s.order_method}
            </span>
          </div>

          <div class="text-[11px] text-slate-400 space-y-0.5 pt-1">
            ${s.phone ? `<p>📞 <a href="tel:${phoneFormatted}" class="text-amber-400 hover:underline">${s.phone}</a></p>` : ''}
            ${s.email ? `<p>✉️ <a href="mailto:${s.email}" class="text-amber-400 hover:underline">${s.email}</a></p>` : ''}
            ${s.notes ? `<p class="text-slate-500 italic mt-1">Note: ${s.notes}</p>` : ''}
          </div>

          ${isUserAdmin ? `
            <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-800">
              <button onclick="startEdit('${s.id}')" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700">
                Modifica
              </button>
              <button onclick="deleteSupplier('${s.id}', '${s.name.replace(/'/g, "\\'")}')" class="px-2.5 py-1 rounded bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30">
                Elimina
              </button>
            </div>
          ` : ''}
        </div>
      `}).join('');
    }

    formSupplier.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Salvataggio...';

      const payload = {
        name: inputName.value.trim(),
        referent: inputReferent.value.trim() || null,
        order_method: inputMethod.value,
        phone: inputPhone.value.trim() || null,
        email: inputEmail.value.trim() || null,
        notes: inputNotes.value.trim() || null
      };

      const id = supplierId.value;
      let res;

      if (id) {
        res = await supabaseClient.from('suppliers').update(payload).eq('id', id);
      } else {
        res = await supabaseClient.from('suppliers').insert([payload]);
      }

      btnSubmit.disabled = false;
      btnSubmit.textContent = id ? 'Aggiorna Fornitore' : 'Salva Fornitore';

      if (res.error) {
        alert('Errore salvataggio: ' + res.error.message);
      } else {
        resetForm();
        loadSuppliers();
      }
    });

    function startEdit(id) {
      const s = suppliersData.find(item => item.id === id);
      if (!s) return;

      supplierId.value = s.id;
      inputName.value = s.name || '';
      inputReferent.value = s.referent || '';
      inputMethod.value = s.order_method || 'whatsapp';
      inputPhone.value = s.phone || '';
      inputEmail.value = s.email || '';
      inputNotes.value = s.notes || '';

      formTitle.textContent = 'Modifica Fornitore';
      btnSubmit.textContent = 'Aggiorna Fornitore';
      btnCancelEdit.classList.remove('hidden');

      formSupplier.scrollIntoView({ behavior: 'smooth' });
    }

    function resetForm() {
      supplierId.value = '';
      formSupplier.reset();
      formTitle.textContent = '+ Nuovo Fornitore';
      btnSubmit.textContent = 'Salva Fornitore';
      btnCancelEdit.classList.add('hidden');
    }

    async function deleteSupplier(id, name) {
      if (!confirm(`Sei sicuro di voler eliminare "${name}"?`)) return;

      const { error } = await supabaseClient.from('suppliers').delete().eq('id', id);
      if (error) {
        alert('Errore eliminazione: ' + error.message);
      } else {
        loadSuppliers();
      }
    }

    btnCancelEdit.addEventListener('click', resetForm);
    document.getElementById('btn-refresh').addEventListener('click', loadSuppliers);

    window.startEdit = startEdit;
    window.deleteSupplier = deleteSupplier;

    checkUserAccess();
  </script>
</body>
</html>
